<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<link rel="manifest" href="manifest.json">
<title>La Liga en vivo</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b1d3a;--mut:#5b6b85;--acc:#e11d48;--brd:#dde3ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#141c2e;--tx:#eef2fa;--mut:#93a1bb;--brd:#25304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team{flex:1;font-weight:600;font-size:15px}.team.r{text-align:right}
.score{font-size:24px;font-weight:800;min-width:70px;text-align:center}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;display:inline-block;margin-bottom:8px;background:var(--brd);color:var(--mut)}
.tag.live{background:var(--acc);color:#fff;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.5}}
h2{font-size:13px;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:8px}
button{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.err{color:var(--acc);font-size:13px;margin:8px 0}
.small{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<h1>⚽ La Liga en vivo</h1>
<div class="sub" id="sub">Configura tu API key</div>
<div id="cfg" class="card">
 <select id="prov">
  <option value="fd">football-data.org (gratis)</option>
  <option value="af">API-Football (api-sports.io)</option>
 </select>
 <input id="key" type="password" placeholder="Pega tu API key" autocomplete="off">
 <button id="save">Guardar y ver partidos</button>
 <div class="small">La key se guarda solo en tu dispositivo.</div>
</div>
<div id="err" class="err"></div>
<div id="v"></div>
<p class="small" style="text-align:center;margin-top:18px"><a href="#" id="chg" style="color:var(--mut)">Cambiar API key</a> · se actualiza cada 60 s</p>
<script>
var $=function(i){return document.getElementById(i)};
function ld(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var timer=null;
function d2(d){return d.toISOString().slice(0,10)}
function hora(iso){return new Date(iso).toLocaleString("es-CO",{weekday:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
async function getFD(key){
 var a=new Date(Date.now()-3*864e5),b=new Date(Date.now()+7*864e5);
 var r=await fetch("https://api.football-data.org/v4/competitions/PD/matches?dateFrom="+d2(a)+"&dateTo="+d2(b),{headers:{"X-Auth-Token":key}});
 if(!r.ok)throw new Error("football-data.org respondió "+r.status+" (revisa tu key)");
 var j=await r.json();
 return j.matches.map(function(m){var s=m.status;
  return{h:m.homeTeam.shortName||m.homeTeam.name,a:m.awayTeam.shortName||m.awayTeam.name,hs:m.score.fullTime.home,as:m.score.fullTime.away,
  st:(s=="IN_PLAY"||s=="PAUSED")?"live":(s=="FINISHED"?"fin":"next"),min:s=="PAUSED"?"Descanso":"",date:m.utcDate}})
}
async function getAF(key){
 var a=new Date(Date.now()-3*864e5),b=new Date(Date.now()+7*864e5);
 var y=new Date().getFullYear(),mo=new Date().getMonth();var season=mo<6?y-1:y;
 var r=await fetch("https://v3.football.api-sports.io/fixtures?league=140&season="+season+"&from="+d2(a)+"&to="+d2(b),{headers:{"x-apisports-key":key}});
 if(!r.ok)throw new Error("API-Football respondió "+r.status);
 var j=await r.json();
 if(j.errors&&Object.keys(j.errors).length)throw new Error(Object.values(j.errors).join(" · "));
 return j.response.map(function(m){var s=m.fixture.status.short;
  var live=["1H","2H","HT","ET","BT","P","LIVE"].indexOf(s)>-1;
  return{h:m.teams.home.name,a:m.teams.away.name,hs:m.goals.home,as:m.goals.away,
  st:live?"live":(["FT","AET","PEN"].indexOf(s)>-1?"fin":"next"),min:live?(s=="HT"?"Descanso":(m.fixture.status.elapsed||"")+"’"):"",date:m.fixture.date}})
}
function card(m){
 var tag=m.st=="live"?'<span class="tag live">● EN VIVO '+m.min+'</span>':(m.st=="fin"?'<span class="tag">FINAL</span>':'<span class="tag">'+hora(m.date)+'</span>');
 var sc=m.st=="next"?"vs":(m.hs+" - "+m.as);
 return '<div class="card">'+tag+'<div class="row"><div class="team">'+m.h+'</div><div class="score">'+sc+'</div><div class="team r">'+m.a+'</div></div></div>';
}
function sec(t,l){return l.length?'<h2>'+t+'</h2>'+l.map(card).join(""):""}
async function load(){
 var key=ld("key"),prov=ld("prov")||"fd";
 if(!key){$("cfg").style.display="block";return}
 $("cfg").style.display="none";$("err").textContent="";
 try{
  var ms=await(prov=="af"?getAF(key):getFD(key));
  ms.sort(function(x,y){return new Date(x.date)-new Date(y.date)});
  var live=ms.filter(function(m){return m.st=="live"}),fin=ms.filter(function(m){return m.st=="fin"}).reverse(),nx=ms.filter(function(m){return m.st=="next"});
  $("v").innerHTML=sec("🔴 En vivo",live)+sec("Próximos",nx)+sec("Resultados",fin)||'<div class="card">No hay partidos en este rango.</div>';
  $("sub").textContent="Actualizado "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
 }catch(e){$("err").textContent=e.message+" · Si dice CORS o 403, prueba el otro proveedor."}
 clearTimeout(timer);timer=setTimeout(load,60000);
}
$("save").onclick=function(){var k=$("key").value.trim();if(!k)return;sv("key",k);sv("prov",$("prov").value);load()};
$("chg").onclick=function(e){e.preventDefault();$("cfg").style.display="block";$("key").value="";$("prov").value=ld("prov")||"fd"};
$("cfg").style.display=ld("key")?"none":"block";
load();
</script>
</body>
</html>
